# Machine 8 Go de RAM : le -Xmx8G du template faisait gonfler le fichier
# d'échange Windows (pagefile 12,8 Go -> disque plein). Rester modeste.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
